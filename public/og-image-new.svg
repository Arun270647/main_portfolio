<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 255, 65, 0.1)" stroke-width="1"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0a"/>

  <!-- Grid pattern -->
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Border -->
  <rect x="20" y="20" width="1160" height="590" fill="none" stroke="#00ff41" stroke-width="4"/>

  <!-- Content -->
  <text x="600" y="240" font-family="monospace" font-size="80" font-weight="bold" fill="#00ff41" text-anchor="middle" filter="url(#glow)">ARUN VIGNESH</text>

  <text x="600" y="310" font-family="monospace" font-size="36" fill="#888888" text-anchor="middle">FULL-STACK WEB DEVELOPER</text>

  <text x="600" y="370" font-family="monospace" font-size="24" fill="rgba(0, 255, 65, 0.5)" text-anchor="middle">React • TypeScript • Node.js • AI/ML</text>

  <!-- Decorative line -->
  <line x1="400" y1="420" x2="800" y2="420" stroke="rgba(0, 255, 65, 0.3)" stroke-width="2"/>

  <!-- Domain -->
  <text x="600" y="490" font-family="monospace" font-size="32" font-weight="bold" fill="#00ff41" text-anchor="middle" filter="url(#glow)">www.arunvignesh.my</text>

  <!-- Small accent -->
  <circle cx="350" cy="490" r="3" fill="#00ff41" opacity="0.5"/>
  <circle cx="850" cy="490" r="3" fill="#00ff41" opacity="0.5"/>
</svg>
