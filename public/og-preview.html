<!DOCTYPE html>
<html>
<head>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 1200px;
            height: 630px;
            background: #0a0a0a;
            font-family: 'Courier New', monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(0, 255, 65, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 65, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .border {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            border: 4px solid #00ff41;
        }
        .content {
            position: relative;
            z-index: 2;
            text-align: center;
        }
        .name {
            font-size: 80px;
            font-weight: bold;
            color: #00ff41;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(0, 255, 65, 0.5);
        }
        .title {
            font-size: 36px;
            color: #888888;
            margin-bottom: 30px;
        }
        .skills {
            font-size: 24px;
            color: rgba(0, 255, 65, 0.5);
            margin-bottom: 60px;
        }
        .domain {
            font-size: 28px;
            font-weight: bold;
            color: #00ff41;
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.3);
        }
    </style>
</head>
<body>
    <div class="grid"></div>
    <div class="border"></div>
    <div class="content">
        <div class="name">ARUN VIGNESH</div>
        <div class="title">FULL-STACK WEB DEVELOPER</div>
        <div class="skills">React • TypeScript • Node.js • AI/ML</div>
        <div class="domain">www.arunvignesh.my</div>
    </div>
</body>
</html>
